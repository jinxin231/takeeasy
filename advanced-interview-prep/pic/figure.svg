<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>

  <!-- Left header: thread-private bracket -->
  <text x="230" y="30" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">线程私有(每线程一份)</text>
  <path d="M60,54 L60,44 L400,44 L400,54" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Thread 1 -->
  <rect x="60" y="70" width="340" height="250" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="97" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">线程 1</text>
  <rect x="90" y="115" width="280" height="50" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <text x="230" y="146" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">PC 寄存器</text>
  <rect x="90" y="175" width="280" height="50" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <text x="230" y="206" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">Java 虚拟机栈(栈帧链)</text>
  <rect x="90" y="235" width="280" height="50" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <text x="230" y="266" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">本地方法栈</text>

  <!-- Thread 2 -->
  <rect x="60" y="340" width="340" height="250" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="367" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">线程 2</text>
  <rect x="90" y="385" width="280" height="50" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <text x="230" y="416" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">PC 寄存器</text>
  <rect x="90" y="445" width="280" height="50" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <text x="230" y="476" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">Java 虚拟机栈(栈帧链)</text>
  <rect x="90" y="505" width="280" height="50" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <text x="230" y="536" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">本地方法栈</text>

  <!-- Shared area -->
  <rect x="450" y="70" width="790" height="530" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="845" y="98" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">共享区</text>

  <!-- Metaspace -->
  <rect x="490" y="120" width="720" height="95" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.4"/>
  <text x="850" y="172" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#222" text-anchor="middle">Metaspace(类元数据)</text>

  <!-- Heap -->
  <rect x="490" y="255" width="720" height="305" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
  <text x="850" y="283" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">堆(所有对象与数组)</text>

  <circle cx="630" cy="370" r="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="630" y="375" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#222" text-anchor="middle">对象</text>
  <circle cx="850" cy="400" r="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="850" y="405" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#222" text-anchor="middle">对象</text>
  <circle cx="720" cy="490" r="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="720" y="495" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#222" text-anchor="middle">对象</text>

  <!-- DirectByteBuffer inside heap -->
  <rect x="940" y="460" width="250" height="70" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="1065" y="488" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#1d4ed8" text-anchor="middle">DirectByteBuffer</text>
  <text x="1065" y="510" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#1d4ed8" text-anchor="middle">(门牌对象)</text>

  <!-- Arrow: stack reference to object -->
  <line x1="370" y1="200" x2="602" y2="351" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="483" y="245" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#1d4ed8" text-anchor="middle">引用</text>

  <!-- Arrow: heap to Metaspace (type pointer) -->
  <line x1="620" y1="253" x2="620" y2="218" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="638" y="240" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#1d4ed8" text-anchor="start">对象头里的类型指针</text>

  <!-- Arrow: DirectByteBuffer to direct memory -->
  <line x1="1065" y1="530" x2="1065" y2="688" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1080" y="590" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#1d4ed8" text-anchor="start">堆外地址</text>

  <!-- Outside JVM managed boundary -->
  <rect x="450" y="640" width="790" height="120" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="470" y="668" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#666" text-anchor="start">JVM 管理边界之外</text>
  <rect x="900" y="690" width="280" height="50" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="1040" y="721" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#222" text-anchor="middle">直接内存(堆外,NIO)</text>
</svg>
