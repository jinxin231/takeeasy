<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <!-- ================= PANEL 1 : 标记进行中 ================= -->
  <g transform="translate(20,20)" font-family="'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',monospace,sans-serif">
    <rect x="0" y="0" width="480" height="420" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="240" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">① 标记进行中</text>

    <rect x="28" y="52" width="112" height="38" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
    <text x="84" y="77" text-anchor="middle" font-size="15" fill="#111">GC Roots</text>

    <line x1="140" y1="71" x2="228" y2="72" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <line x1="86" y1="90" x2="101" y2="188" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>

    <circle cx="255" cy="72" r="24" fill="#222222"/>
    <text x="255" y="79" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">A</text>

    <circle cx="105" cy="215" r="24" fill="#b9b9b9" stroke="#666666" stroke-width="1.5"/>
    <text x="105" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B</text>

    <circle cx="335" cy="245" r="24" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <text x="335" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">x</text>

    <line x1="129" y1="218" x2="309" y2="241" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="219" y="212" text-anchor="middle" font-size="14" fill="#111">B.field</text>
  </g>

  <!-- ================= PANEL 2 : a.field = x 之后 ================= -->
  <g transform="translate(540,20)" font-family="'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',monospace,sans-serif">
    <rect x="0" y="0" width="480" height="420" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="240" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">② a.field = x 之后</text>

    <rect x="28" y="52" width="112" height="38" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
    <text x="84" y="77" text-anchor="middle" font-size="15" fill="#111">GC Roots</text>

    <line x1="140" y1="71" x2="228" y2="72" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <line x1="86" y1="90" x2="101" y2="188" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>

    <circle cx="255" cy="72" r="24" fill="#222222"/>
    <text x="255" y="79" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">A</text>

    <circle cx="105" cy="215" r="24" fill="#b9b9b9" stroke="#666666" stroke-width="1.5"/>
    <text x="105" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B</text>

    <circle cx="335" cy="245" r="24" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <text x="335" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">x</text>

    <line x1="129" y1="218" x2="309" y2="241" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="219" y="212" text-anchor="middle" font-size="14" fill="#111">B.field</text>

    <line x1="265" y1="94" x2="325" y2="222" stroke="#d32f2f" stroke-width="2.4" marker-end="url(#arrR)"/>
    <text x="330" y="150" text-anchor="start" font-size="14" font-weight="bold" fill="#d32f2f">新插入 黑→白</text>
  </g>

  <!-- ================= PANEL 3 : b.field = null 之后 ================= -->
  <g transform="translate(20,460)" font-family="'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',monospace,sans-serif">
    <rect x="0" y="0" width="480" height="420" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="240" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">③ b.field = null 之后</text>

    <rect x="28" y="52" width="112" height="38" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
    <text x="84" y="77" text-anchor="middle" font-size="15" fill="#111">GC Roots</text>

    <line x1="140" y1="71" x2="228" y2="72" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <line x1="86" y1="90" x2="101" y2="188" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>

    <circle cx="255" cy="72" r="24" fill="#222222"/>
    <text x="255" y="79" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">A</text>

    <circle cx="105" cy="215" r="24" fill="#b9b9b9" stroke="#666666" stroke-width="1.5"/>
    <text x="105" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B</text>

    <circle cx="335" cy="245" r="24" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <text x="335" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">x</text>

    <!-- deleted B->x : dashed + strikethrough -->
    <line x1="129" y1="218" x2="309" y2="241" stroke="#999999" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrG)"/>
    <line x1="216" y1="206" x2="224" y2="254" stroke="#d32f2f" stroke-width="3"/>
    <text x="219" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">已切断</text>

    <line x1="265" y1="94" x2="325" y2="222" stroke="#d32f2f" stroke-width="2.4" marker-end="url(#arrR)"/>
    <text x="330" y="150" text-anchor="start" font-size="14" font-weight="bold" fill="#d32f2f">新插入 黑→白</text>

    <text x="240" y="398" text-anchor="middle" font-size="14.5" fill="#333">x 只挂在黑色 A 上,波面到不了它 → 标记结束时被错杀</text>
  </g>

  <!-- ================= PANEL 4 : SATB 救场 ================= -->
  <g transform="translate(540,460)" font-family="'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',monospace,sans-serif">
    <rect x="0" y="0" width="480" height="420" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="240" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">③' SATB 救场</text>

    <rect x="28" y="52" width="112" height="38" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
    <text x="84" y="77" text-anchor="middle" font-size="15" fill="#111">GC Roots</text>

    <line x1="140" y1="71" x2="228" y2="72" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <line x1="86" y1="90" x2="101" y2="188" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>

    <circle cx="255" cy="72" r="24" fill="#222222"/>
    <text x="255" y="79" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">A</text>

    <circle cx="105" cy="215" r="24" fill="#b9b9b9" stroke="#666666" stroke-width="1.5"/>
    <text x="105" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B</text>

    <!-- x now GRAY -->
    <circle cx="335" cy="245" r="24" fill="#b9b9b9" stroke="#666666" stroke-width="1.5"/>
    <text x="335" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">x</text>

    <!-- deleted B->x : dashed + strikethrough -->
    <line x1="129" y1="218" x2="309" y2="241" stroke="#999999" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrG)"/>
    <line x1="216" y1="206" x2="224" y2="254" stroke="#d32f2f" stroke-width="3"/>
    <text x="219" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">已切断</text>

    <line x1="265" y1="94" x2="325" y2="222" stroke="#d32f2f" stroke-width="2.4" marker-end="url(#arrR)"/>
    <text x="330" y="150" text-anchor="start" font-size="14" font-weight="bold" fill="#d32f2f">新插入 黑→白</text>

    <!-- SATB buffer -->
    <rect x="28" y="308" width="140" height="38" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
    <text x="98" y="332" text-anchor="middle" font-size="14" fill="#111">SATB 缓冲区</text>
    <line x1="170" y1="318" x2="310" y2="255" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="240" y="304" text-anchor="middle" font-size="13.5" fill="#111">记录旧引用</text>

    <text x="240" y="398" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">x 被补标,存活</text>
  </g>
</svg>